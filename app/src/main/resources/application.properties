spring.application.name=app
jwt.secret=CheieMeaSecretaFoarteLungaSiSiguraPentruJWT1234567890!
jwt.expiration=86400000

# Adresa bazei de date (localhost:3306 / numele bazei)
spring.datasource.url=jdbc:mysql://localhost:3306/sistem_bancar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Userul și parola cu care te conectezi în DBeaver
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Setări Hibernate (să nu îți creeze el tabelele, ci doar să valideze)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect